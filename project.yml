# CamCard 工程的唯一来源。
# 生成 Xcode 工程：xcodegen generate
# CamCard.xcodeproj 是生成产物，不纳入版本控制。

name: CamCard

options:
  minimumXcodeGenVersion: "2.46.0"
  projectFormat: xcode16_0        # objectVersion 77，启用 synchronized folders
  xcodeVersion: "26.0"            # LastUpgradeCheck / scheme LastUpgradeVersion
  developmentLanguage: en
  settingPresets: all
  defaultSourceDirectoryType: syncedFolder
  deploymentTarget:
    iOS: "26.0"

configs:
  Debug: debug
  Release: release

# XcodeGen 的预设基于较旧的 Xcode，这里补齐 Xcode 26 的工程级默认值
settings:
  ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
  CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
  ENABLE_USER_SCRIPT_SANDBOXING: YES
  GCC_C_LANGUAGE_STANDARD: gnu17
  LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  CamCard:
    type: application
    platform: iOS
    sources:
      - path: CamCard
        type: syncedFolder
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "用于拍摄名片并以本地方式识别联系人信息。"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "用于从相册导入名片图片并以本地方式识别联系人信息。"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: cn.chaotze.CamCard
        PRODUCT_NAME: "$(TARGET_NAME)"
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"

  CamCardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CamCardTests
        type: syncedFolder
    dependencies:
      - target: CamCard
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: cn.chaotze.CamCardTests
        PRODUCT_NAME: "$(TARGET_NAME)"
        STRING_CATALOG_GENERATE_SYMBOLS: NO
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CamCard.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/CamCard"

  CamCardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CamCardUITests
        type: syncedFolder
    dependencies:
      - target: CamCard
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: cn.chaotze.CamCardUITests
        PRODUCT_NAME: "$(TARGET_NAME)"
        STRING_CATALOG_GENERATE_SYMBOLS: NO
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: CamCard

schemes:
  CamCard:
    build:
      targets:
        CamCard: all
        CamCardTests: [test]
        CamCardUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CamCardTests
        - CamCardUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
